name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    name: Patch Attendance Core break persistence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/attendance-core

      - name: Apply persistence fix and push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Backend/TaskMonitoring.Api/Services/AttendanceCoreService.cs')
          text = path.read_text()
          old = '''        var session = sessionResult.Session!;
          if (session.Breaks.Any(x => !x.EndedAtUtc.HasValue))
          {
              return OperationResult<WorkSessionResponse>.Conflict("break_already_open", "A break is already in progress.");
          }

          var now = UtcNow();
          var workBreak = new WorkBreak
          {
              WorkSessionId = session.Id,
              WorkSession = session,
              StartedAtUtc = now,
              CreatedAtUtc = now
          };
          session.Breaks.Add(workBreak);
          session.UpdatedAtUtc = now;'''
          new = '''        var session = sessionResult.Session!;
          if (await dbContext.WorkBreaks.AnyAsync(
              x => x.WorkSessionId == session.Id && !x.EndedAtUtc.HasValue,
              cancellationToken))
          {
              return OperationResult<WorkSessionResponse>.Conflict("break_already_open", "A break is already in progress.");
          }

          var now = UtcNow();
          var workBreak = new WorkBreak
          {
              WorkSessionId = session.Id,
              WorkSession = session,
              StartedAtUtc = now,
              CreatedAtUtc = now
          };
          dbContext.WorkBreaks.Add(workBreak);
          session.UpdatedAtUtc = now;'''
          if old not in text:
              raise SystemExit('Expected StartBreak block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Services/AttendanceCoreService.cs
          git commit -m "fix: persist attendance breaks explicitly"
          git push origin HEAD:feature/attendance-core
