name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_monitoring_tests
          POSTGRES_USER: task_monitoring
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_monitoring -d task_monitoring_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=task_monitoring_tests;Username=task_monitoring;Password=ci-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TaskMonitoring.slnx

      - name: Build
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Verify EF model matches migrations
        env:
          TASK_MONITORING_DESIGN_CONNECTION: ${{ env.TEST_POSTGRES_CONNECTION }}
        run: dotnet ef migrations has-pending-model-changes --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build

      - name: Test
        run: dotnet test tests/Backend.Tests/Backend.Tests.csproj --configuration Release --no-build --no-restore

  admin-web:
    name: Admin web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AdminWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

  admin-web-e2e:
    name: Admin web end-to-end and RBAC (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_monitoring_e2e
          POSTGRES_USER: task_monitoring
          POSTGRES_PASSWORD: e2e-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_monitoring -d task_monitoring_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_API_URL: http://127.0.0.1:5080
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_ADMIN_EMAIL: e2e-admin@example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate a throwaway administrator password
        run: |
          password="E2e-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start the API on a fresh database
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=task_monitoring_e2e;Username=task_monitoring;Password=e2e-${{ github.run_id }}
          Jwt__SigningKey: e2e-ci-only-signing-key-${{ github.run_id }}-0123456789abcdef
          Database__AutoMigrate: "true"
          BootstrapAdmin__Email: ${{ env.E2E_ADMIN_EMAIL }}
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          export BootstrapAdmin__Password="$E2E_ADMIN_PASSWORD"
          dotnet build src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release
          nohup dotnet run --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent --max-time 5 "$E2E_API_URL/health/ready" >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Give TeamLead employee read access without organisation-wide scope
        env:
          PGPASSWORD: e2e-${{ github.run_id }}
        run: psql -h localhost -U task_monitoring -d task_monitoring_e2e -v ON_ERROR_STOP=1 -f tests/e2e/seed-roles.sql

      - name: Build and serve the Admin Web
        working-directory: src/AdminWeb
        run: |
          npm ci --no-audit --no-fund
          npm run build
          VITE_DEV_API_TARGET="$E2E_API_URL" nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 "$E2E_BASE_URL/login" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1

      - name: Install Playwright and Chromium
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run end-to-end and RBAC tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  admin-web-visual:
    name: Admin web visual regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same image the baselines were rendered in, so fonts and anti-aliasing match.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    env:
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and serve the Admin Web
        working-directory: src/AdminWeb
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1

      - name: Compare pages with the committed screenshots
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright test -c playwright.visual.config.ts

      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-visual-diff
          path: |
            tests/e2e/playwright-report-visual
            tests/e2e/test-results
          retention-days: 7

  production-environment:
    name: Production environment, backup/restore and observability acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate production shell scripts
        shell: bash
        run: |
          for script in scripts/production/*.sh; do
            bash -n "$script"
          done

      - name: Prepare isolated production environment
        shell: bash
        run: |
          sudo sh -c 'printf "127.0.0.1 app.localhost updates.localhost\n" >> /etc/hosts'
          cat > deploy/production/production.ci.env <<'EOF'
          APP_SITE_ADDRESS=http://app.localhost
          UPDATE_SITE_ADDRESS=http://updates.localhost
          ACME_EMAIL=ci@example.invalid
          APP_PUBLIC_URL=http://app.localhost:18080
          UPDATE_PUBLIC_URL=http://updates.localhost:18080
          PRODUCTION_HTTP_BIND=127.0.0.1
          PRODUCTION_HTTP_PORT=18080
          PRODUCTION_HTTPS_BIND=127.0.0.1
          PRODUCTION_HTTPS_PORT=18443
          POSTGRES_DB=task_monitoring
          POSTGRES_USER=task_monitoring
          JWT_ISSUER=TaskMonitoring.Api
          JWT_AUDIENCE=TaskMonitoring.Clients
          POSTGRES_PASSWORD_SECRET_FILE=./secrets/postgres_password
          DATABASE_CONNECTION_SECRET_FILE=./secrets/database_connection
          JWT_SIGNING_KEY_SECRET_FILE=./secrets/jwt_signing_key
          GRAFANA_ADMIN_PASSWORD_SECRET_FILE=./secrets/grafana_admin_password
          UPDATE_HOST_ROOT=./updates
          BACKUP_ROOT=./backups
          OBSERVABILITY_BIND=127.0.0.1
          GRAFANA_PORT=13000
          PROMETHEUS_PORT=19090
          LOKI_PORT=13100
          OTEL_HEALTH_PORT=13133
          PROMETHEUS_RETENTION=1d
          OTEL_METRIC_EXPORT_INTERVAL=5000
          EOF
          bash scripts/production/init-production-secrets.sh deploy/production/production.ci.env
          docker compose --env-file deploy/production/production.ci.env -f deploy/production/docker-compose.yml config >/dev/null
          docker compose --env-file deploy/production/production.ci.env -f deploy/production/docker-compose.yml -f deploy/production/observability.compose.yml config >/dev/null

      - name: Deploy production stack through guarded deployment path
        shell: bash
        run: bash scripts/production/deploy.sh deploy/production/production.ci.env

      - name: Verify one-shot production SuperAdmin bootstrap
        shell: bash
        run: |
          printf 'CI-only-bootstrap-password-123!\nCI-only-bootstrap-password-123!\n' | \
            bash scripts/production/bootstrap-admin.sh \
              --env deploy/production/production.ci.env \
              --email ci-superadmin@example.invalid

      - name: Verify PostgreSQL backup and restore actually restores data
        shell: bash
        run: |
          compose=(docker compose --env-file deploy/production/production.ci.env -f deploy/production/docker-compose.yml)
          # 200k incompressible rows make the archive several MB: the backup's read-back check used to
          # die of SIGPIPE on anything over a few hundred kB (G-50), which a tiny probe never showed.
          "${compose[@]}" exec -T postgres psql -U task_monitoring -d task_monitoring -v ON_ERROR_STOP=1 -c 'CREATE TABLE ci_restore_probe(id integer primary key, value text not null); INSERT INTO ci_restore_probe VALUES (1, '\''before-backup'\''); INSERT INTO ci_restore_probe SELECT g, md5(random()::text) FROM generate_series(2, 200000) g;'
          backup_path="$(bash scripts/production/backup-postgres.sh deploy/production/production.ci.env restore-probe)"
          test "$(wc -c < "$backup_path")" -gt 1000000
          # A table created after the backup (as a newer release's migration would) with a foreign key
          # into restored data: --clean used to fail on it and leave constraints dropped (G-49).
          "${compose[@]}" exec -T postgres psql -U task_monitoring -d task_monitoring -v ON_ERROR_STOP=1 -c 'DELETE FROM ci_restore_probe WHERE id > 1; CREATE TABLE ci_restore_after_backup(id integer primary key REFERENCES ci_restore_probe(id));'
          bash scripts/production/restore-postgres.sh --env deploy/production/production.ci.env --backup "$backup_path" --confirm-restore
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 5 http://app.localhost:18080/health/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          count="$("${compose[@]}" exec -T postgres psql -U task_monitoring -d task_monitoring -tAc 'SELECT count(*) FROM ci_restore_probe WHERE id=1 AND value='\''before-backup'\'';' | tr -d '[:space:]')"
          test "$count" = "1"
          rows="$("${compose[@]}" exec -T postgres psql -U task_monitoring -d task_monitoring -tAc 'SELECT count(*) FROM ci_restore_probe;' | tr -d '[:space:]')"
          test "$rows" = "200000"
          leftover="$("${compose[@]}" exec -T postgres psql -U task_monitoring -d task_monitoring -tAc "SELECT count(*) FROM information_schema.tables WHERE table_name = 'ci_restore_after_backup';" | tr -d '[:space:]')"
          test "$leftover" = "0"
          "${compose[@]}" exec -T postgres psql -U task_monitoring -d task_monitoring -v ON_ERROR_STOP=1 -c 'DROP TABLE ci_restore_probe;'

      - name: Verify atomic immutable update publication and public acceptance
        shell: bash
        run: |
          bundle="${{ runner.temp }}/synthetic-signed-bundle"
          mkdir -p "$bundle"
          package='TaskMonitoring.EmployeeRuntime-9.9.9-win-x64.zip'
          printf 'ci-release-package' > "$bundle/$package"
          size="$(wc -c < "$bundle/$package" | tr -d ' ')"
          sha="$(sha256sum "$bundle/$package" | awk '{print toupper($1)}')"
          cat > "$bundle/release.json" <<EOF
          {"schemaVersion":1,"channel":"stable","version":"9.9.9","publishedAtUtc":"2026-01-01T00:00:00Z","minimumUpdaterVersion":"1.0.0","package":{"file":"$package","url":"http://updates.localhost:18080/stable/$package","sha256":"$sha","sizeBytes":$size}}
          EOF
          printf 'synthetic-ci-certificate' > "$bundle/publisher-certificate.cer"
          certificate_sha="$(sha256sum "$bundle/publisher-certificate.cer" | awk '{print toupper($1)}')"
          printf '%s' "$certificate_sha" > "$bundle/publisher-certificate-sha256.txt"

          bash scripts/production/publish-windows-release.sh --env deploy/production/production.ci.env --bundle "$bundle"
          bash scripts/production/acceptance-server.sh --env deploy/production/production.ci.env --channel stable

          # Retrying the exact same bundle is safe and idempotent.
          bash scripts/production/publish-windows-release.sh --env deploy/production/production.ci.env --bundle "$bundle"

          # The certificate file must be cryptographically bound to its published fingerprint.
          bad_certificate_bundle="${{ runner.temp }}/bad-certificate-bundle"
          cp -a "$bundle" "$bad_certificate_bundle"
          printf 'different-certificate' > "$bad_certificate_bundle/publisher-certificate.cer"
          if bash scripts/production/publish-windows-release.sh --env deploy/production/production.ci.env --bundle "$bad_certificate_bundle"; then
            echo 'Publisher accepted certificate bytes that do not match the pinned fingerprint.' >&2
            exit 1
          fi

          # A version that has been archived must never be replaced by different bytes.
          changed_bundle="${{ runner.temp }}/changed-same-version-bundle"
          cp -a "$bundle" "$changed_bundle"
          printf 'different-runtime-package-for-same-version' > "$changed_bundle/$package"
          changed_size="$(wc -c < "$changed_bundle/$package" | tr -d ' ')"
          changed_sha="$(sha256sum "$changed_bundle/$package" | awk '{print toupper($1)}')"
          cat > "$changed_bundle/release.json" <<EOF
          {"schemaVersion":1,"channel":"stable","version":"9.9.9","publishedAtUtc":"2026-01-01T00:00:01Z","minimumUpdaterVersion":"1.0.0","package":{"file":"$package","url":"http://updates.localhost:18080/stable/$package","sha256":"$changed_sha","sizeBytes":$changed_size}}
          EOF
          if bash scripts/production/publish-windows-release.sh --env deploy/production/production.ci.env --bundle "$changed_bundle"; then
            echo 'Publisher overwrote an immutable release version with different bytes.' >&2
            exit 1
          fi

      - name: Start private observability stack
        shell: bash
        run: bash scripts/production/observability-up.sh deploy/production/production.ci.env

      - name: Verify observability telemetry acceptance
        shell: bash
        run: bash scripts/production/acceptance-observability.sh deploy/production/production.ci.env

      - name: Production stack diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose --env-file deploy/production/production.ci.env -f deploy/production/docker-compose.yml -f deploy/production/observability.compose.yml ps || true
          docker compose --env-file deploy/production/production.ci.env -f deploy/production/docker-compose.yml -f deploy/production/observability.compose.yml logs --no-color || true

      - name: Tear down production stack
        if: always()
        shell: bash
        run: docker compose --env-file deploy/production/production.ci.env -f deploy/production/docker-compose.yml -f deploy/production/observability.compose.yml down -v --remove-orphans || true

  employee-windows:
    name: Employee Windows client, release and lifecycle acceptance
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore desktop client
        run: dotnet restore src/EmployeeDesktop/TaskMonitoring.EmployeeDesktop/TaskMonitoring.EmployeeDesktop.csproj

      - name: Build desktop client
        run: dotnet build src/EmployeeDesktop/TaskMonitoring.EmployeeDesktop/TaskMonitoring.EmployeeDesktop.csproj --configuration Release --no-restore

      - name: Restore Windows service
        run: dotnet restore src/EmployeeService/TaskMonitoring.EmployeeService/TaskMonitoring.EmployeeService.csproj

      - name: Build Windows service
        run: dotnet build src/EmployeeService/TaskMonitoring.EmployeeService/TaskMonitoring.EmployeeService.csproj --configuration Release --no-restore

      - name: Restore employee updater
        run: dotnet restore src/EmployeeUpdater/TaskMonitoring.EmployeeUpdater/TaskMonitoring.EmployeeUpdater.csproj

      - name: Build employee updater
        run: dotnet build src/EmployeeUpdater/TaskMonitoring.EmployeeUpdater/TaskMonitoring.EmployeeUpdater.csproj --configuration Release --no-restore

      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/windows/start-admin-local.ps1',
            'scripts/windows/publish-employee-windows.ps1',
            'scripts/windows/install-employee-service.ps1',
            'scripts/windows/uninstall-employee-service.ps1',
            'scripts/windows/deployment-common.ps1',
            'scripts/windows/build-employee-release.ps1',
            'scripts/windows/install-employee-windows.ps1',
            'scripts/windows/uninstall-employee-windows.ps1',
            'scripts/windows/rollback-employee-windows.ps1',
            'scripts/windows/run-central-agent-update.ps1',
            'scripts/windows/test-central-agent-update.ps1',
            'scripts/windows/test-employee-release.ps1',
            'scripts/windows/test-install-update-rollback.ps1'
          )
          foreach ($script in $scripts) {
            [void][scriptblock]::Create((Get-Content $script -Raw))
          }

      - name: Validate local Admin database modes on Windows PowerShell
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\start-admin-local.ps1 -ValidateOnly -DatabaseMode Auto
          if ($LASTEXITCODE -ne 0) { throw 'Auto launcher validation failed.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\start-admin-local.ps1 -ValidateOnly -DatabaseMode Native -PostgresPort 55432
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher validation failed.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\start-admin-local.ps1 -ValidateOnly -DatabaseMode Docker
          if ($LASTEXITCODE -ne 0) { throw 'Docker launcher validation failed.' }

      - name: Run centralized updater control acceptance
        shell: pwsh
        run: ./scripts/windows/test-central-agent-update.ps1 -WorkingRoot "${{ runner.temp }}\central-update-acceptance"

      - name: Publish legacy employee Windows outputs
        shell: pwsh
        run: ./scripts/windows/publish-employee-windows.ps1 -OutputRoot "${{ runner.temp }}\employee-windows"

      - name: Build unsigned CI release bundle
        shell: pwsh
        run: ./scripts/windows/build-employee-release.ps1 -Version "0.0.0" -OutputRoot "${{ runner.temp }}\employee-release" -AllowUnsignedDevelopmentBuild

      - name: Validate CI release bundle
        shell: pwsh
        run: ./scripts/windows/test-employee-release.ps1 -ReleaseDirectory "${{ runner.temp }}\employee-release\TaskMonitoring.EmployeeRelease-0.0.0-win-x64" -AllowUnsignedDevelopmentBuild

      - name: Build lifecycle acceptance releases
        shell: pwsh
        run: |
          ./scripts/windows/build-employee-release.ps1 -Version "1.0.0" -OutputRoot "${{ runner.temp }}\employee-acceptance-initial" -AllowUnsignedDevelopmentBuild
          ./scripts/windows/build-employee-release.ps1 -Version "1.0.1" -OutputRoot "${{ runner.temp }}\employee-acceptance-update" -AllowUnsignedDevelopmentBuild

      - name: Run install update rollback uninstall acceptance
        shell: pwsh
        run: |
          ./scripts/windows/test-install-update-rollback.ps1 `
            -InitialReleaseDirectory "${{ runner.temp }}\employee-acceptance-initial\TaskMonitoring.EmployeeRelease-1.0.0-win-x64" `
            -UpdateReleaseDirectory "${{ runner.temp }}\employee-acceptance-update\TaskMonitoring.EmployeeRelease-1.0.1-win-x64" `
            -InstallRoot "${{ runner.temp }}\TaskMonitoringInstall" `
            -ProgramDataRoot "${{ runner.temp }}\TaskMonitoringProgramData"
