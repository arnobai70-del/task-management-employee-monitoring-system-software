name: Patch Survey Service

on:
  push:
    branches:
      - feature/survey-field-operations-core
    paths:
      - .github/workflows/patch-survey-service.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/survey-field-operations-core

      - name: Mark new survey submissions as Added
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Backend/TaskMonitoring.Api/Services/SurveyCoreService.cs')
          text = path.read_text()
          old = '            assignment.Submissions.Add(submission);'
          if text.count(old) != 2:
              raise SystemExit(f'Expected exactly two submission creation anchors, found {text.count(old)}')
          new = old + '\n            dbContext.SurveySubmissions.Add(submission);'
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Services/SurveyCoreService.cs
          git commit -m "fix: explicitly add survey submissions"
          git push origin HEAD:feature/survey-field-operations-core
