name: Harden access assignment uniqueness

on:
  push:
    branches:
      - feature/admin-management-access-assignments

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'generated access uniqueness') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/admin-management-access-assignments

      - name: Add database uniqueness mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Backend/TaskMonitoring.Api/Data/AppDbContext.cs')
          s = p.read_text()
          block = '''

        modelBuilder.Entity<RdpAssignment>(entity =>
        {
            entity.HasIndex(x => new { x.EmployeeId, x.Host, x.Port })
                .IsUnique()
                .HasFilter("\\\"IsActive\\\"");
        });

        modelBuilder.Entity<IpAssignment>(entity =>
        {
            entity.HasIndex(x => x.IpAddress)
                .IsUnique()
                .HasFilter("\\\"Status\\\" <> 3");
        });

        modelBuilder.Entity<WebsiteAssignment>(entity =>
        {
            entity.HasIndex(x => new { x.EmployeeId, x.Url })
                .IsUnique()
                .HasFilter("\\\"IsActive\\\"");
        });
'''
          if 'HasFilter("\\"Status\\" <> 3")' not in s:
              marker = '        modelBuilder.Entity<SurveyAnswer>(entity =>\n'
              s = s.replace(marker, block + '\n' + marker)
          p.write_text(s)
          PY

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore TaskMonitoring.slnx
          dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Generate uniqueness migration
        env:
          TASK_MONITORING_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=design_only;Username=design;Password=design
        run: dotnet ef migrations add AccessAssignmentUniqueness --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build

      - name: Commit hardening and generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Data/AppDbContext.cs src/Backend/TaskMonitoring.Api/Migrations
          git commit -m "chore: generated access uniqueness"
          git push origin HEAD:feature/admin-management-access-assignments
