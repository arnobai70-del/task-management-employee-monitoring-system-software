services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-task_monitoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-task_monitoring} -d ${POSTGRES_DB:-task_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
