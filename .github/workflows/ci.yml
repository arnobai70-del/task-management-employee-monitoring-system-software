name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  migration-order-fix:
    name: Fix Employee Core migration order
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/employee-core

      - name: Correct migration sequence and persist
        run: |
          old=20260929003514_EmployeeCore
          new=20260929062000_EmployeeCore
          sed -i "s/${old}/${new}/g" "src/Backend/TaskMonitoring.Api/Migrations/${old}.Designer.cs"
          mv "src/Backend/TaskMonitoring.Api/Migrations/${old}.cs" "src/Backend/TaskMonitoring.Api/Migrations/${new}.cs"
          mv "src/Backend/TaskMonitoring.Api/Migrations/${old}.Designer.cs" "src/Backend/TaskMonitoring.Api/Migrations/${new}.Designer.cs"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Migrations
          git commit -m "fix: order employee core migration after identity foundation"
          git push origin HEAD:feature/employee-core
