name: Production Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric semantic version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      channel:
        description: Update channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      server_url:
        description: HTTPS TaskMonitoring application URL embedded in the signed standalone setup wizard
        required: true
        type: string
      package_base_url:
        description: HTTPS base URL where release.json and runtime ZIP will be hosted
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-release:
    name: Build and validate signed employee release
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require production code-signing certificate
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) {
            throw 'WINDOWS_SIGNING_PFX_BASE64 repository secret is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) {
            throw 'WINDOWS_SIGNING_PFX_PASSWORD repository secret is required.'
          }

      - name: Materialize signing certificate
        id: signing
        shell: pwsh
        run: |
          $pfx = Join-Path '${{ runner.temp }}' 'taskmonitoring-code-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          "pfx=$pfx" >> $env:GITHUB_OUTPUT

      - name: Build signed release bundle
        shell: pwsh
        run: |
          ./scripts/windows/build-employee-release.ps1 `
            -Version '${{ inputs.version }}' `
            -Channel '${{ inputs.channel }}' `
            -ServerUrl '${{ inputs.server_url }}' `
            -PackageBaseUrl '${{ inputs.package_base_url }}' `
            -OutputRoot '${{ runner.temp }}\employee-release' `
            -PfxPath '${{ steps.signing.outputs.pfx }}' `
            -PfxPassword $env:WINDOWS_SIGNING_PFX_PASSWORD

      - name: Build signed standalone setup EXE
        shell: pwsh
        run: |
          $release = '${{ runner.temp }}\employee-release\TaskMonitoring.EmployeeRelease-${{ inputs.version }}-win-x64'
          $manifestUrl = '${{ inputs.package_base_url }}'.TrimEnd('/') + '/release.json'
          ./scripts/windows/make-employee-setup-standalone.ps1 `
            -ReleaseDirectory $release `
            -ServerUrl '${{ inputs.server_url }}' `
            -UpdateManifestUrl $manifestUrl `
            -PfxPath '${{ steps.signing.outputs.pfx }}' `
            -PfxPassword $env:WINDOWS_SIGNING_PFX_PASSWORD

      - name: Validate signed release bundle
        shell: pwsh
        run: |
          $release = '${{ runner.temp }}\employee-release\TaskMonitoring.EmployeeRelease-${{ inputs.version }}-win-x64'
          $fingerprint = (Get-Content (Join-Path $release 'publisher-certificate-sha256.txt') -Raw).Trim()
          ./scripts/windows/test-employee-release.ps1 -ReleaseDirectory $release -PublisherCertificateSha256 $fingerprint
          $setup = Join-Path $release 'TaskMonitoring.EmployeeSetup.exe'
          $signature = Get-AuthenticodeSignature -FilePath $setup
          if ($signature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
            throw "Standalone setup signature is not valid. Status=$($signature.Status)"
          }
          $runtime = Get-ChildItem $release -Filter 'TaskMonitoring.EmployeeRuntime-*.zip' | Select-Object -First 1
          if ($null -eq $runtime -or (Get-Item $setup).Length -le $runtime.Length) {
            throw 'Standalone setup does not appear to contain the embedded employee payload.'
          }

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force '${{ steps.signing.outputs.pfx }}' -ErrorAction SilentlyContinue

      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: TaskMonitoring.EmployeeRelease-${{ inputs.version }}-${{ inputs.channel }}
          path: ${{ runner.temp }}\employee-release\TaskMonitoring.EmployeeRelease-${{ inputs.version }}-win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: TaskMonitoring.EmployeeSetup-${{ inputs.version }}-${{ inputs.channel }}
          path: ${{ runner.temp }}\employee-release\TaskMonitoring.EmployeeRelease-${{ inputs.version }}-win-x64\TaskMonitoring.EmployeeSetup.exe
          if-no-files-found: error
          retention-days: 30
