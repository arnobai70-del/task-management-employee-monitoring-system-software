name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_monitoring_tests
          POSTGRES_USER: task_monitoring
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_monitoring -d task_monitoring_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=task_monitoring_tests;Username=task_monitoring;Password=ci-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TaskMonitoring.slnx

      - name: Build
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Generate Employee Core migration diagnostic
        env:
          TASK_MONITORING_DESIGN_CONNECTION: ${{ env.TEST_POSTGRES_CONNECTION }}
        run: |
          dotnet ef migrations add EmployeeCore --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build --output-dir Migrations
          echo '=== GENERATED EMPLOYEE CORE MIGRATION ==='
          for file in src/Backend/TaskMonitoring.Api/Migrations/*_EmployeeCore*.cs; do
            echo "=== FILE: $file ==="
            cat "$file"
          done
          echo '=== GENERATED MODEL SNAPSHOT ==='
          cat src/Backend/TaskMonitoring.Api/Migrations/AppDbContextModelSnapshot.cs
          exit 1
