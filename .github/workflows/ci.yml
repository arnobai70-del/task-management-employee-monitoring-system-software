name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  backend:
    name: Generate Employee Core migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_monitoring_tests
          POSTGRES_USER: task_monitoring
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_monitoring -d task_monitoring_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=task_monitoring_tests;Username=task_monitoring;Password=ci-${{ github.run_id }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/employee-core

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TaskMonitoring.slnx

      - name: Build
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Generate and persist Employee Core migration
        env:
          TASK_MONITORING_DESIGN_CONNECTION: ${{ env.TEST_POSTGRES_CONNECTION }}
        run: |
          dotnet ef migrations add EmployeeCore --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build --output-dir Migrations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Migrations
          git commit -m "feat: add employee core database migration"
          git push origin HEAD:feature/employee-core
