name: Generate Survey Migration

on:
  push:
    branches:
      - feature/survey-field-operations-core
    paths:
      - .github/workflows/generate-survey-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/survey-field-operations-core

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore TaskMonitoring.slnx

      - name: Build source
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Generate canonical migration
        env:
          TASK_MONITORING_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=task_monitoring_design;Username=task_monitoring;Password=design-only
        shell: bash
        run: |
          dotnet ef migrations add SurveyFieldOperationsCore \
            --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj \
            --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj \
            --output-dir Migrations \
            --configuration Release \
            --no-build
          python3 - <<'PY'
          from pathlib import Path
          migrations = Path('src/Backend/TaskMonitoring.Api/Migrations')
          candidates = sorted(p for p in migrations.glob('*_SurveyFieldOperationsCore.cs') if not p.name.endswith('.Designer.cs'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected one SurveyFieldOperationsCore migration, found {len(candidates)}')
          migration = candidates[0]
          generated_prefix = migration.name.split('_SurveyFieldOperationsCore.cs')[0]
          desired_prefix = '20260929080000'
          designer = migrations / f'{generated_prefix}_SurveyFieldOperationsCore.Designer.cs'
          if not designer.exists():
              raise SystemExit('Generated designer file not found')
          designer_text = designer.read_text().replace(
              f'[Migration("{generated_prefix}_SurveyFieldOperationsCore")]',
              f'[Migration("{desired_prefix}_SurveyFieldOperationsCore")]')
          designer.write_text(designer_text)
          migration.rename(migrations / f'{desired_prefix}_SurveyFieldOperationsCore.cs')
          designer.rename(migrations / f'{desired_prefix}_SurveyFieldOperationsCore.Designer.cs')
          PY

      - name: Rebuild with generated snapshot
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Verify migration consistency
        env:
          TASK_MONITORING_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=task_monitoring_design;Username=task_monitoring;Password=design-only
        run: dotnet ef migrations has-pending-model-changes --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Migrations
          git commit -m "feat: add survey field operations migration"
          git push origin HEAD:feature/survey-field-operations-core
