name: Patch Project Projection

on:
  push:
    branches:
      - feature/project-task-core
    paths:
      - .github/workflows/patch-project-projection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/project-task-core

      - name: Patch translated project projections
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('src/Backend/TaskMonitoring.Api/Services/ProjectTaskCoreService.cs')
          text = path.read_text()
          old_list = base64.b64decode('').decode()
          new_list = base64.b64decode('').decode()
          old_get = base64.b64decode('ICAgICAgICB2YXIgcHJvamVjdCA9IGF3YWl0IGRiQ29udGV4dC5Qcm9qZWN0cwogICAgICAgICAgICAuQXNOb1RyYWNraW5nKCkKICAgICAgICAgICAgLldoZXJlKHggPT4geC5JZCA9PSBpZCkKICAgICAgICAgICAgLlNlbGVjdCh4ID0+IFRvUHJvamVjdFJlc3BvbnNlUHJvamVjdGlvbih4KSkKICAgICAgICAgICAgLlNpbmdsZU9yRGVmYXVsdEFzeW5jKGNhbmNlbGxhdGlvblRva2VuKTs=').decode()
          new_get = base64.b64decode('').decode()
          if old_list not in text or old_get not in text:
              raise SystemExit('Expected project projection anchors not found')
          path.write_text(text.replace(old_list, new_list, 1).replace(old_get, new_get, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Services/ProjectTaskCoreService.cs
          git commit -m "fix: translate project summary counts server-side"
          git push origin HEAD:feature/project-task-core
