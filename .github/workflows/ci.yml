name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  hardening:
    name: Apply Employee Core hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/employee-core

      - name: Apply hardening patch and persist
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('src/Backend/TaskMonitoring.Api/Services/EmployeeCoreService.cs')
          service = service_path.read_text()
          service = service.replace(
              '        page = Math.Max(page, 1);\n',
              '        page = Math.Clamp(page, 1, 1_000_000);\n')
          old_roles = '''        dbContext.UserRoles.RemoveRange(employee.User.UserRoles);
                  employee.User.UserRoles.Clear();
                  foreach (var role in references.Roles)
                  {
                      employee.User.UserRoles.Add(new UserRole { UserId = employee.UserId, RoleId = role.Id });
                  }
          '''
          new_roles = '''        var userRolesToRemove = employee.User.UserRoles
                      .Where(x => !requestedRoleIds.Contains(x.RoleId))
                      .ToArray();
                  dbContext.UserRoles.RemoveRange(userRolesToRemove);
                  foreach (var role in references.Roles.Where(x => !currentRoleIds.Contains(x.Id)))
                  {
                      employee.User.UserRoles.Add(new UserRole { UserId = employee.UserId, RoleId = role.Id });
                  }
          '''
          if old_roles not in service:
              raise SystemExit('role update block not found')
          service = service.replace(old_roles, new_roles)
          service_path.write_text(service)

          controller_path = Path('src/Backend/TaskMonitoring.Api/Controllers/EmployeesController.cs')
          controller = controller_path.read_text()
          marker = '    [Authorize(Policy = PermissionCatalog.EmployeesManage)]\n'
          replacement = marker + '    [Authorize(Policy = PermissionCatalog.RolesManage)]\n'
          if controller.count(marker) != 2:
              raise SystemExit('expected exactly two employee manage authorization markers')
          controller = controller.replace(marker, replacement)
          controller_path.write_text(controller)

          program_path = Path('src/Backend/TaskMonitoring.Api/Program.cs')
          program = program_path.read_text()
          old_converter = 'new JsonStringEnumConverter()'
          new_converter = 'new JsonStringEnumConverter(allowIntegerValues: false)'
          if old_converter not in program:
              raise SystemExit('enum converter marker not found')
          program_path.write_text(program.replace(old_converter, new_converter))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Services/EmployeeCoreService.cs src/Backend/TaskMonitoring.Api/Controllers/EmployeesController.cs src/Backend/TaskMonitoring.Api/Program.cs
          git commit -m "fix: harden employee access management"
          git push origin HEAD:feature/employee-core
