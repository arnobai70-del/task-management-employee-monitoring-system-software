name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    name: Patch Attendance Core break persistence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/attendance-core

      - name: Apply persistence fix and push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Backend/TaskMonitoring.Api/Services/AttendanceCoreService.cs')
          text = path.read_text()
          old_check = 'if (session.Breaks.Any(x => !x.EndedAtUtc.HasValue))'
          new_check = '''if (await dbContext.WorkBreaks.AnyAsync(
              x => x.WorkSessionId == session.Id && !x.EndedAtUtc.HasValue,
              cancellationToken))'''
          if old_check not in text:
              raise SystemExit('Expected open-break check not found')
          text = text.replace(old_check, new_check, 1)
          old_add = 'session.Breaks.Add(workBreak);'
          if old_add not in text:
              raise SystemExit('Expected break collection add not found')
          text = text.replace(old_add, 'dbContext.WorkBreaks.Add(workBreak);', 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Services/AttendanceCoreService.cs
          git commit -m "fix: persist attendance breaks explicitly"
          git push origin HEAD:feature/attendance-core
