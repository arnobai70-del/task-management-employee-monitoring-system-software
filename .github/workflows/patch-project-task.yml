name: Patch Project Task Core

on:
  push:
    branches:
      - feature/project-task-core
    paths:
      - .github/workflows/patch-project-task.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/project-task-core

      - name: Apply audit metadata fix and push
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Backend/TaskMonitoring.Api/Services/ProjectTaskCoreService.cs')
          text = path.read_text()
          old = '            DetailsJson = JsonSerializer.Serialize(details),\n            IpAddress = actor.IpAddress,'
          new = '            MetadataJson = JsonSerializer.Serialize(details),\n            IpAddress = actor.IpAddress,'
          if old not in text:
              raise SystemExit('Expected audit metadata anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Services/ProjectTaskCoreService.cs
          git commit -m "fix: use audit metadata field"
          git push origin HEAD:feature/project-task-core
