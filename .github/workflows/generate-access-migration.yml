name: Generate access assignment migration

on:
  push:
    branches:
      - feature/admin-management-access-assignments

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'generated access migration') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/admin-management-access-assignments

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore TaskMonitoring.slnx

      - name: Build
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Generate canonical EF migration
        env:
          TASK_MONITORING_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=design_only;Username=design;Password=design
        run: |
          dotnet ef migrations add AccessAssignments --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Migrations
          git commit -m "chore: generated access migration"
          git push origin HEAD:feature/admin-management-access-assignments
