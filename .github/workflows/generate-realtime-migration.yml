name: Generate realtime migration

on:
  push:
    branches:
      - feature/realtime-presence-notifications
    paths:
      - .github/workflows/generate-realtime-migration.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore TaskMonitoring.slnx
      - name: Generate migration
        env:
          TASK_MONITORING_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=design;Username=design;Password=design
        run: >-
          dotnet ef migrations add RealtimePresenceNotifications
          --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj
          --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj
          --output-dir Migrations
      - name: Collect generated files
        shell: bash
        run: |
          mkdir -p generated
          cp src/Backend/TaskMonitoring.Api/Migrations/*RealtimePresenceNotifications*.cs generated/
          cp src/Backend/TaskMonitoring.Api/Migrations/AppDbContextModelSnapshot.cs generated/
          ls -la generated
      - uses: actions/upload-artifact@v4
        with:
          name: realtime-migration
          path: generated
          if-no-files-found: error
