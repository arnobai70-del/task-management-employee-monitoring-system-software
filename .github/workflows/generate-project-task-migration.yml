name: Generate Project Task Migration

on:
  push:
    branches:
      - feature/project-task-core
    paths:
      - .github/workflows/generate-project-task-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/project-task-core

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore TaskMonitoring.slnx

      - name: Build source
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Generate canonical migration
        env:
          TASK_MONITORING_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=task_monitoring_design;Username=task_monitoring;Password=design-only
        shell: bash
        run: |
          dotnet ef migrations add ProjectTaskCore --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --output-dir Migrations --configuration Release --no-build
          migrations=src/Backend/TaskMonitoring.Api/Migrations
          generated_file=$(find "$migrations" -maxdepth 1 -name '*_ProjectTaskCore.cs' ! -name '*.Designer.cs' -print -quit)
          test -n "$generated_file"
          generated_prefix=$(basename "$generated_file" | sed 's/_ProjectTaskCore.cs//')
          designer="$migrations/${generated_prefix}_ProjectTaskCore.Designer.cs"
          test -f "$designer"
          desired_prefix=20260929070000
          sed -i "s/${generated_prefix}_ProjectTaskCore/${desired_prefix}_ProjectTaskCore/g" "$designer"
          mv "$generated_file" "$migrations/${desired_prefix}_ProjectTaskCore.cs"
          mv "$designer" "$migrations/${desired_prefix}_ProjectTaskCore.Designer.cs"

      - name: Rebuild with generated snapshot
        run: dotnet build TaskMonitoring.slnx --configuration Release --no-restore

      - name: Verify migration consistency
        env:
          TASK_MONITORING_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=task_monitoring_design;Username=task_monitoring;Password=design-only
        run: dotnet ef migrations has-pending-model-changes --project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --startup-project src/Backend/TaskMonitoring.Api/TaskMonitoring.Api.csproj --configuration Release --no-build

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/TaskMonitoring.Api/Migrations
          git commit -m "feat: add project-task core migration"
          git push origin HEAD:feature/project-task-core
